services:
  zk-proof-of-vaccination-pki:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_PROVIDER: mock
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set a strong AUDIT_SECRET_KEY before starting}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
