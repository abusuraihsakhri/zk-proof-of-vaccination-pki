version: '3.8'

services:
  zk-proof-of-vaccination-pki:
    build: .
    container_name: zk-proof-of-vaccination-pki
    ports:
      - "8000:8000"
    environment:
      - MODEL_PROVIDER=mock
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
