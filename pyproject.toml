[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zk-proof-of-vaccination-pki"
version = "2.0.0"
description = "ZK-HealthPass: Anonymous Selective-Disclosure Credential Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
zk-proof-of-vaccination-pki = "zk_health_pass.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/zk-proof-of-vaccination-pki"
Repository = "https://github.com/abusuraihsakhri/zk-proof-of-vaccination-pki.git"
