[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zk-proof-of-vaccination-pki"
version = "2.0.1"
description = "Threshold-based credential-workflow evaluation prototype (no ZK cryptography)"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
zk-proof-of-vaccination-pki = "zk_health_pass.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/zk-proof-of-vaccination-pki"
Repository = "https://github.com/abusuraihsakhri/zk-proof-of-vaccination-pki"

[tool.setuptools]
packages = ["agents", "zk_health_pass"]
py-modules = ["cli", "enrichment", "simulator", "zk_health_pass_app"]
