name: Tests and security regressions

on:
  push:
    branches: [master, main, 'audit/**']
  pull_request:
    branches: [master, main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install '.[server,test]'
      - name: Check installed dependencies
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q agents zk_health_pass cli.py enrichment.py
      - name: Run regression tests
        run: python -m pytest -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --test web/app.test.cjs
